# Cible Windows.
#   docker compose -f docker-compose.windows.yml build
#   docker compose -f docker-compose.windows.yml run --rm plugin
#   docker compose -f docker-compose.windows.yml run --rm export
# Résultat : ./dist-win/bin/liteide.exe et liteideaf.dll
#
# Les scripts sont montés en lecture seule sous /mnt/scripts.
# Compose les copie dans /tmp et leur donne 755 : les droits de l'hôte
# ne comptent pas, et on n'écrase pas les binaires de l'image.

name: liteide-win

x-build: &build
  context: .
  dockerfile: Dockerfile
  args:
    JOBS: "${JOBS:-auto}"
    GOPROXY: https://proxy.golang.org,direct

services:
  plugin:
    build:
      <<: *build
      target: dev
    image: liteide-dev-windows:qt6
    working_dir: /work
    stdin_open: true
    tty: true
    environment:
      LITEIDEX: /src/liteide/liteidex
      PLUGIN_DIR: /work/plugin-src/liteideaf
      QMAKE: /opt/mxe/usr/x86_64-w64-mingw32.shared/qt6/bin/qmake
      DIST: /dist
    volumes:
      - type: bind
        source: ./plugin-src
        target: /work/plugin-src
      - type: bind
        source: ./dist-win
        target: /dist
        bind:
          create_host_path: true
      - type: bind
        source: ./build-plugin.sh
        target: /mnt/scripts/build-plugin.sh
        read_only: true
    entrypoint: ["bash", "-lc"]
    command:
      - |
        cp /mnt/scripts/build-plugin.sh /tmp/build-plugin.sh
        chmod 755 /tmp/build-plugin.sh
        exec /tmp/build-plugin.sh
    restart: "no"

  export:
    image: liteide-dev-windows:qt6
    working_dir: /dist
    environment:
      DIST: /dist
      REQUIRE_PLUGIN: "1"
      LITEIDE_WIN: /opt/liteide-dist-win
    volumes:
      - type: bind
        source: ./plugin-src
        target: /work/plugin-src
      - type: bind
        source: ./dist-win
        target: /dist
        bind:
          create_host_path: true
      - type: bind
        source: ./distribute.sh
        target: /mnt/scripts/distribute.sh
        read_only: true
    entrypoint: ["bash", "-lc"]
    command:
      - |
        cp /mnt/scripts/distribute.sh /tmp/distribute.sh
        chmod 755 /tmp/distribute.sh
        exec /tmp/distribute.sh windows
    restart: "no"
