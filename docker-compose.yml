name: liteide-win

x-build: &build
  context: .
  dockerfile: Dockerfile
  args:
    JOBS: "8"
    GOPROXY: https://proxy.golang.org,direct

services:
  export:
    build:
      <<: *build
      target: runtime
    image: liteide-win-export:qt6
    volumes:
      - type: bind
        source: ./dist
        target: /dist
        bind:
          create_host_path: true
    working_dir: /dist
    restart: "no"

  # Normalisation du nom de l'adaptateur Windows
  plugin-dev-windows:
    build:
      <<: *build
      target: dev
    image: liteide-win-dev:qt6
    working_dir: /work
    stdin_open: true
    tty: true
    environment:
      LITEIDEX: /src/liteide/liteidex
      PLUGIN_DIR: /work/plugin-src/liteideaf
      DIST: /dist
    volumes:
      - type: bind
        source: ./plugin-src
        target: /work/plugin-src
      - type: bind
        source: ./dist
        target: /dist
    restart: "no"

  # Adaptateur Linux natif
  plugin-dev-linux:
    build:
      <<: *build
      target: linux-dev
    image: liteide-linux-dev:qt6
    working_dir: /work
    stdin_open: true
    tty: true
    environment:
      LITEIDEX: /src/liteide/liteidex
      PLUGIN_DIR: /work/plugin-src/liteideaf
      DIST: /dist
    volumes:
      - type: bind
        source: ./plugin-src
        target: /work/plugin-src
      - type: bind
        source: ./dist-linux
        target: /dist
    restart: "no"