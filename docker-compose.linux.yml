# Cible Linux.
#   docker compose -f docker-compose.linux.yml build
#   docker compose -f docker-compose.linux.yml run --rm plugin
#   docker compose -f docker-compose.linux.yml run --rm export
# Résultat : ./dist-linux/bin/liteide et libliteideaf.so
#
# Les scripts sont montés en lecture seule sous /mnt/scripts.
# Compose les copie dans /tmp et leur donne 755 : les droits de l'hôte
# ne comptent pas, et on n'écrase pas les binaires de l'image.

name: liteide-linux

x-build: &build
  context: .
  dockerfile: Dockerfile
  args:
    JOBS: "${JOBS:-auto}"
    GOPROXY: https://proxy.golang.org,direct

services:
  plugin:
    build:
      <<: *build
      target: dev
    image: liteide-dev:qt6
    working_dir: /work
    stdin_open: true
    tty: true
    environment:
      LITEIDEX: /src/liteide-linux/liteidex
      PLUGIN_DIR: /work/plugin-src/liteideaf
      QMAKE: qmake6
      DIST: /dist
    volumes:
      - type: bind
        source: ./plugin-src
        target: /work/plugin-src
      - type: bind
        source: ./dist-linux
        target: /dist
        bind:
          create_host_path: true
      - type: bind
        source: ./build-plugin-linux.sh
        target: /mnt/scripts/build-plugin-linux.sh
        read_only: true
    entrypoint: ["bash", "-lc"]
    command:
      - |
        cp /mnt/scripts/build-plugin-linux.sh /tmp/build-plugin-linux.sh
        chmod 755 /tmp/build-plugin-linux.sh
        exec /tmp/build-plugin-linux.sh
    restart: "no"

  export:
    image: liteide-dev:qt6
    working_dir: /dist
    environment:
      DIST: /dist
      REQUIRE_PLUGIN: "1"
      LITEIDE_LINUX: /opt/liteide-dist-linux
    volumes:
      - type: bind
        source: ./plugin-src
        target: /work/plugin-src
      - type: bind
        source: ./dist-linux
        target: /dist
        bind:
          create_host_path: true
      - type: bind
        source: ./distribute.sh
        target: /mnt/scripts/distribute.sh
        read_only: true
    entrypoint: ["bash", "-lc"]
    command:
      - |
        cp /mnt/scripts/distribute.sh /tmp/distribute.sh
        chmod 755 /tmp/distribute.sh
        exec /tmp/distribute.sh linux
    restart: "no"
