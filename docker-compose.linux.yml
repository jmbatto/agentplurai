# Cible Linux.
#   docker compose -f docker-compose.linux.yml build
#   docker compose -f docker-compose.linux.yml run --rm plugin
#   docker compose -f docker-compose.linux.yml run --rm export
# Résultat : ./dist-linux/bin/liteide et libliteideaf.so

name: liteide-linux

x-build: &build
  context: .
  dockerfile: Dockerfile
  args:
    JOBS: "${JOBS:-auto}"
    GOPROXY: https://proxy.golang.org,direct

services:
  plugin:
    build:
      <<: *build
      target: dev
    image: liteide-dev:qt6
    working_dir: /work
    stdin_open: true
    tty: true
    environment:
      LITEIDEX: /src/liteide-linux/liteidex
      PLUGIN_DIR: /work/plugin-src/liteideaf
      QMAKE: qmake6
      DIST: /dist
    volumes:
      - type: bind
        source: ./plugin-src
        target: /work/plugin-src
      - type: bind
        source: ./dist-linux
        target: /dist
        bind:
          create_host_path: true
      - type: bind
        source: ./build-plugin-linux.sh
        target: /usr/local/bin/build-plugin-linux.sh
    command: ["build-plugin-linux.sh"]
    restart: "no"

  export:
    image: liteide-dev:qt6
    working_dir: /dist
    environment:
      DIST: /dist
      REQUIRE_PLUGIN: "1"
      LITEIDE_LINUX: /opt/liteide-dist-linux
    volumes:
      - type: bind
        source: ./plugin-src
        target: /work/plugin-src
      - type: bind
        source: ./dist-linux
        target: /dist
        bind:
          create_host_path: true
      - type: bind
        source: ./distribute.sh
        target: /usr/local/bin/distribute.sh
    entrypoint: ["/usr/local/bin/distribute.sh"]
    command: ["linux"]
    restart: "no"
